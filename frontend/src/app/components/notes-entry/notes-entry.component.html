<mat-card>
  <mat-card-title>Create a new note</mat-card-title>
  <mat-card-content>
    <form [formGroup]="noteForm" (ngSubmit)="submit()" class="note-form">
      <mat-form-field appearance="outline">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" placeholder="Quick reminder" />
        <mat-hint align="end">{{ noteForm.controls.title.value?.length || 0 }}/120</mat-hint>
        <mat-error *ngIf="noteForm.controls.title.hasError('required')">
          Title is required
        </mat-error>
        <mat-error *ngIf="noteForm.controls.title.hasError('maxlength')">
          Title must be at most 120 characters
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Content</mat-label>
        <textarea
          matInput
          formControlName="content"
          rows="8"
          placeholder="Write your note content here"
        ></textarea>
        <mat-hint align="end">{{ noteForm.controls.content.value?.length || 0 }}/4000</mat-hint>
        <mat-error *ngIf="noteForm.controls.content.hasError('required')">
          Content is required
        </mat-error>
        <mat-error *ngIf="noteForm.controls.content.hasError('maxlength')">
          Content must be at most 4000 characters
        </mat-error>
      </mat-form-field>

      <div class="actions">
        <button mat-stroked-button color="primary" type="button" routerLink="/">
          Cancel
        </button>
        <button mat-flat-button color="accent" type="submit" [disabled]="isSubmitting">
          <mat-progress-spinner
            *ngIf="isSubmitting"
            diameter="20"
            mode="indeterminate"
          ></mat-progress-spinner>
          <span *ngIf="!isSubmitting">Save note</span>
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
