<mat-card class="list-card">
  <mat-card-title>Notes</mat-card-title>
  <mat-card-content>
    <div class="search-bar">
      <mat-form-field appearance="outline">
        <mat-label>Search notes</mat-label>
        <input
          matInput
          placeholder="Filter by title or content"
          [formControl]="searchControl"
        />
        <button
          *ngIf="searchControl.value"
          mat-icon-button
          matSuffix
          type="button"
          aria-label="Clear search"
          (click)="searchControl.setValue('')"
        >
          <mat-icon>close</mat-icon>
        </button>
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <ng-template #loadingState>
      <div class="loading">
        <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
      </div>
    </ng-template>

    <ng-container *ngIf="!isLoading; else loadingState">
      <div class="table-container" *ngIf="dataSource.data.length; else emptyState">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef>Title</th>
            <td mat-cell *matCellDef="let note">{{ note.title }}</td>
          </ng-container>

          <ng-container matColumnDef="content">
            <th mat-header-cell *matHeaderCellDef>Preview</th>
            <td mat-cell *matCellDef="let note">{{ note.content | slice: 0:120 }}<span *ngIf="note.content.length > 120">&hellip;</span></td>
          </ng-container>

          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef>Created</th>
            <td mat-cell *matCellDef="let note">{{ note.createdAt | date: 'medium' }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns; trackBy: trackByNoteId"></tr>
        </table>
      </div>

      <ng-template #emptyState>
        <p class="empty-state">No notes found. Try adjusting your search or add a new note.</p>
      </ng-template>
    </ng-container>

    <mat-paginator
      [length]="total"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25, 50]"
      (page)="handlePageEvent($event)"
    ></mat-paginator>
  </mat-card-content>
</mat-card>
